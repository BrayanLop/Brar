# Producción en la instancia de Lightsail (Docker + nginx). EJEMPLO: ajusta nombres a tu servidor.
#
# Brar NO lleva Postgres aquí: usa la BD de Supabase (ConnectionStrings__DefaultConnection en el .env).
# Brar y Natural se hablan por una red interna de Docker, así la API interna de plataforma
# (/api/Plataforma) no necesita estar expuesta a internet.
#
# Una sola vez:
#   docker network create natural-net
#   docker network connect natural-net <contenedor-de-natural>      # o añade la red al compose de Natural
#
# Despliegue / actualización:
#   cp .env.example .env   (rellenar)  ·  docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:
  brar:
    image: bray09/brar-api:${BRAR_VERSION:-1.0.0}
    container_name: brar-api
    env_file: .env
    environment:
      # Natural por la red interna (nombre del contenedor + puerto interno 8080), no por la URL pública.
      NaturalApi__BaseUrl: ${NaturalApi__BaseUrl:-http://natural-api:8080/api}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # nginx pone X-Forwarded-For: Brar lo usa para auditar la IP real. Seguro porque 8080 solo se publica en 127.0.0.1.
      UseForwardedHeaders: "true"
    ports:
      - "127.0.0.1:8081:8080"   # solo accesible desde la propia instancia (nginx); nunca 0.0.0.0
    networks:
      - natural-net
    restart: unless-stopped

networks:
  natural-net:
    external: true
