# EJEMPLOS de nginx para la instancia de Lightsail. Ajusta dominios, rutas y nombres a tu servidor.
# Después de editar:  sudo nginx -t && sudo systemctl reload nginx

# ───────────────────────────────────────────────────────────────────────────────
# 1) Brar en su propio subdominio  (recomendado: no toca ninguna ruta de Natural)
#    Requisitos: registro DNS  A  brar.naturalback.vip -> IP de la instancia,
#    y certificado:  sudo certbot --nginx -d brar.naturalback.vip
# ───────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name brar.naturalback.vip;

    # (certbot agrega aquí ssl_certificate / ssl_certificate_key)

    location / {
        proxy_pass         http://127.0.0.1:8081;     # puerto publicado por docker-compose.prod.yml
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;   # Brar audita esta IP
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name brar.naturalback.vip;
    return 301 https://$host$request_uri;
}

# ───────────────────────────────────────────────────────────────────────────────
# 2) Cierra la API interna de plataforma de Natural al público  (acción de F6.2)
#    Va DENTRO del `server { ... }` que ya sirve naturalback.vip, ANTES del `location` que reenvía /v2/.
#    `~*` = sin distinguir mayúsculas (las rutas de ASP.NET no las distinguen: /api/plataforma también llega).
#    Brar no pasa por aquí: llama a Natural por la red interna de Docker.
# ───────────────────────────────────────────────────────────────────────────────
#    location ~* ^/v2/api/plataforma {
#        return 404;
#    }

# ───────────────────────────────────────────────────────────────────────────────
# 3) Alternativa: Brar bajo un prefijo del mismo dominio (https://naturalback.vip/brar/...)
#    Con la barra final en proxy_pass nginx RECORTA /brar, así que NO hace falta PathBase.
# ───────────────────────────────────────────────────────────────────────────────
#    location /brar/ {
#        proxy_pass         http://127.0.0.1:8081/;
#        proxy_http_version 1.1;
#        proxy_set_header   Host              $host;
#        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#        proxy_set_header   X-Forwarded-Proto $scheme;
#    }
#    (Si dejas el prefijo en la ruta —proxy_pass sin barra final— define PathBase=/brar en el .env.)
